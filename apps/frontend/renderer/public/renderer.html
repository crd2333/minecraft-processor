<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schematic Renderer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101519;
        --panel: rgba(25, 32, 37, 0.96);
        --panel-strong: #252e34;
        --border: #46545d;
        --text: #f1f4f5;
        --muted: #a8b2b8;
        --accent: #e4a64f;
        --accent-hover: #f1bc70;
        --capture: #56b88a;
        --danger: #f08080;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button { min-width: 0; font: inherit; letter-spacing: 0; }
      button:focus-visible { outline: 3px solid var(--accent-hover); outline-offset: 2px; }
      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #renderer-app {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      #square-guide {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(78vw, 78vh);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px dashed rgba(255, 255, 255, 0.78);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      #control-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        width: min(336px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid rgba(112, 129, 139, 0.72);
        border-radius: 8px;
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
        pointer-events: auto;
      }
      header, section, footer { display: flex; flex-direction: column; gap: 9px; }
      section + section { padding-top: 15px; border-top: 1px solid rgba(130, 145, 154, 0.2); }
      .eyebrow { margin: 0; color: var(--accent-hover); font-size: 11px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: 0; }
      h2 { margin: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
      .asset-name {
        min-height: 46px;
        padding: 10px 11px;
        overflow-wrap: anywhere;
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: #fff;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .stat-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .stat {
        min-width: 0;
        padding: 9px;
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .stat-label { color: var(--muted); font-size: 11px; }
      .stat-value { margin-top: 2px; overflow-wrap: anywhere; font-weight: 700; font-variant-numeric: tabular-nums; }
      .capture-row, .navigation-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .preset-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .capture-button, .navigation-button, .preset-button {
        min-height: 44px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: #2c373d;
        cursor: pointer;
      }
      .capture-button { border-color: rgba(86, 184, 138, 0.72); background: #254237; font-weight: 700; }
      .capture-button:hover:not(:disabled) { background: #315947; border-color: var(--capture); }
      .navigation-button:hover:not(:disabled), .preset-button:hover:not(:disabled) { background: #3a474e; border-color: #84929a; }
      button:disabled { cursor: not-allowed; opacity: 0.48; }
      #status { min-height: 42px; color: var(--muted); font-size: 12px; }
      #status[data-kind="success"] { color: #83d9ad; }
      #status[data-kind="error"] { color: var(--danger); }
      footer { margin-top: auto; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
      @media (max-width: 760px) {
        #square-guide { width: min(88vw, 58vh); }
        #control-panel {
          top: auto;
          right: 8px;
          bottom: 8px;
          left: 8px;
          width: auto;
          max-height: 48vh;
          padding: 14px;
          gap: 12px;
        }
        h1 { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <main id="renderer-app">
      <div id="square-guide" aria-hidden="true"></div>
      <aside id="control-panel" aria-label="Schematic render controls">
        <header>
          <p class="eyebrow">Server capture</p>
          <h1>Schematic Renderer</h1>
          <div id="asset-name" class="asset-name">Loading scene...</div>
          <div class="stat-row">
            <div class="stat"><div class="stat-label">Scene</div><div id="scene-position" class="stat-value">0 / 0</div></div>
            <div class="stat"><div class="stat-label">Saved views</div><div id="capture-count" class="stat-value">0</div></div>
            <div class="stat"><div class="stat-label">Size</div><div id="structure-size" class="stat-value">--</div></div>
            <div class="stat"><div class="stat-label">Format</div><div id="asset-format" class="stat-value">--</div></div>
          </div>
        </header>
        <section aria-labelledby="capture-title">
          <h2 id="capture-title">Capture</h2>
          <div class="capture-row">
            <button class="capture-button" data-capture-size="1024" disabled>Capture 1024</button>
            <button class="capture-button" data-capture-size="2048" disabled>Capture 2048</button>
          </div>
        </section>
        <section aria-labelledby="camera-title">
          <h2 id="camera-title">Camera</h2>
          <div class="preset-row">
            <button class="preset-button" data-preset="front">Front</button>
            <button class="preset-button" data-preset="rear">Rear</button>
            <button class="preset-button" data-preset="top">Top</button>
          </div>
        </section>
        <section aria-labelledby="navigation-title">
          <h2 id="navigation-title">Scenes</h2>
          <div class="navigation-row">
            <button id="previous-button" class="navigation-button" disabled>Previous Scene</button>
            <button id="next-button" class="navigation-button" disabled>Next Scene</button>
          </div>
        </section>
        <div id="status" role="status" aria-live="polite">Connecting...</div>
        <footer><div>Output: <span id="output-directory">--</span></div></footer>
      </aside>
    </main>
    <script src="/viewer-preload.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/index.js"></script>
    <script src="/renderer.js"></script>
  </body>
</html>
