<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prismarine Structure Viewer</title>
    <style>
      html { overflow: hidden; }
      html, body { height: 100%; margin: 0; padding: 0; }
      canvas { display: block; height: 100%; width: 100%; margin: 0; padding: 0; }
      #export-panel {
        position: fixed; top: 10px; right: 10px; z-index: 1000;
        display: flex; flex-direction: column; gap: 6px;
        width: 280px;
        background: rgba(0, 0, 0, 0.72); padding: 10px 12px; border-radius: 8px;
        font-family: sans-serif;
      }
      #export-panel button {
        cursor: pointer; background: #2a7fd4; color: #fff;
        border: none; border-radius: 5px; padding: 7px 14px;
        font-size: 13px; white-space: nowrap;
      }
      #export-panel button:hover { background: #1a6bc0; }
      #export-status { color: #ccc; font-size: 11px; text-align: center; min-height: 14px; }
      .panel-section { display: flex; flex-direction: column; gap: 6px; }
      .panel-title { color: #f0f0f0; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
      .panel-checkbox { display: flex; align-items: center; gap: 8px; color: #ddd; font-size: 12px; }
      .panel-checkbox input { margin: 0; }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 8px;
      }
      .field-grid label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: #ddd;
        font-size: 11px;
      }
      .field-grid input, #bbox-command {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        padding: 6px 8px;
        font-size: 12px;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .command-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .command-label { color: #ddd; font-size: 11px; }
      #bbox-command {
        min-height: 52px;
        resize: vertical;
        font-family: monospace;
      }
      .command-hint { color: #c6c6c6; font-size: 11px; line-height: 1.35; }
    </style>
  </head>
  <body>
    <script src="/viewer-preload.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/index.js"></script>
    <script src="/vendor/three/OBJExporter.js"></script>
    <script src="/vendor/three/STLExporter.js"></script>
    <script src="/vendor/three/GLTFExporter.js"></script>
    <script src="/viewer-hooks.js"></script>
  </body>
</html>
